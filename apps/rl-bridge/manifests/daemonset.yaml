# rl-bridge DaemonSet.
#
# One pod per node labeled rl-worker=true. Each pod joins the long-lived
# RayCluster (rl-head) as a Ray worker node so its plasma store is local
# to that K8s node — when the trainer puts policy bytes into Ray, each
# node fetches once and serves all locally-colocated UE worker pods.
#
# Runs the agi-rl-rl-bridge image: bridge-entrypoint.sh does `ray start
# --address=<head>` to join the cluster, then execs bridge_daemon.py
# which hosts the named `policy_cache_<node>` actor and listens on the
# UDS at /var/run/rl-bridge/control.sock for UE worker registrations.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rl-bridge
  labels:
    app.kubernetes.io/name: rl-bridge
    app.kubernetes.io/part-of: ppo-training
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rl-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rl-bridge
        app.kubernetes.io/part-of: ppo-training
    spec:
      serviceAccountName: rl-bridge
      # Scope to nodes that host UE workers. The infra repo labels those
      # via Pulumi (rl-worker=true on the GKE primary pool and the kind
      # control-plane); GPU nodes are intentionally left unlabeled since
      # UE workers can't tolerate the GPU taint and there's no UE work
      # there for the bridge to broker.
      nodeSelector:
        rl-worker: "true"
      containers:
        - name: bridge
          # Built by agi-unreal-rl/scripts/build-and-load.sh and loaded
          # into kind (or pushed to AR for cloud). IfNotPresent matches the
          # local kind-load flow — the node already has the image, so
          # there's no registry to pull from.
          image: agi-rl-rl-bridge:kuberay-dev
          imagePullPolicy: IfNotPresent
          # ENTRYPOINT is /opt/bridge-entrypoint.sh: `ray start --address`
          # then `exec python /opt/bridge_daemon.py`.
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RAY_HEAD_ADDR
              value: rl-head-head-svc.experiments.svc.cluster.local:6379
            - name: BRIDGE_RAY_NAMESPACE
              value: rl-bridge
          # Generous CPU request, no limits — when Ray's raylet (runs as a
          # subprocess inside this container after `ray start`) hits CPU
          # throttling, it misses heartbeats to the head, gets marked dead,
          # the PolicyCache actor dies, and any UE worker mid-mmap of the
          # shmem segments that actor was holding open SIGBUSes (signal 7).
          # Matches the worker/trainer pattern of no-limits-burst-freely.
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits: {}
          volumeMounts:
            # Shared with UE worker pods on the same node — UE's
            # shared-memory communicator and our bridge's matching
            # Python SharedMemoryCommunicator both mmap segments here.
            - name: shm
              mountPath: /dev/shm
            # UE workers will drop their registration over the UDS at
            # /var/run/rl-bridge/control.sock. Phase A2 just mounts the
            # path; Phase B's bridge_daemon.py creates the socket.
            - name: bridge-control
              mountPath: /var/run/rl-bridge
      volumes:
        - name: shm
          hostPath:
            path: /dev/shm
            type: Directory
        - name: bridge-control
          hostPath:
            path: /var/run/rl-bridge
            type: DirectoryOrCreate
