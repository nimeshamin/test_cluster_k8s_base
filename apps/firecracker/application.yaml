apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: firecracker
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/nimeshamin/test_cluster_k8s_base.git
    targetRevision: firecracker
    path: apps/firecracker/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: firecracker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
