apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-pipelines
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/kubeflow/pipelines.git
    targetRevision: "2.16.1"
    path: manifests/kustomize/env/platform-agnostic
    # Two patches on top of upstream platform-agnostic:
    #   (1) workflow-controller Deployment — drop `--namespaced` so the
    #       controller watches cluster-wide and reconciles Workflows in the
    #       `experiments` namespace alongside KFP's control plane in
    #       `kubeflow`. Cluster-scope RBAC for the SA lives in
    #       apps/kubeflow-crds/manifests/workflow-controller-cluster-rbac.yaml.
    #   (2) workflow-controller-configmap — strip the default
    #       `artifactRepository` block. Upstream pins it to a SeaweedFS bucket
    #       and the `mlpipeline-minio-artifact` Secret in the kubeflow ns;
    #       since Workflows run in `experiments` and Argo expects the secret
    #       in the workflow's own namespace, archiveLogs sidecars FailMount.
    #       We don't archive workflow logs (Loki captures them), so removing
    #       the block sidesteps the cross-namespace secret problem entirely.
    kustomize:
      patches:
        - target:
            group: apps
            version: v1
            kind: Deployment
            name: workflow-controller
          patch: |-
            - op: replace
              path: /spec/template/spec/containers/0/args
              value:
                - --configmap
                - workflow-controller-configmap
                - --executor-image
                - quay.io/argoproj/argoexec:v3.7.3
        - target:
            version: v1
            kind: ConfigMap
            name: workflow-controller-configmap
          patch: |-
            - op: remove
              path: /data/artifactRepository
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - ".spec.conversion"
        - ".status"
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - ".webhooks[]?.clientConfig.caBundle"
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - ".webhooks[]?.clientConfig.caBundle"
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - ".spec.template.spec.containers[]?.image"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
