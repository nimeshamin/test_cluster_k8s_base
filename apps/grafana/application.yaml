apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bootstrap
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      releaseName: grafana
      valuesObject:
        service:
          type: ClusterIP
        ingress:
          enabled: false
        persistence:
          enabled: true
          size: 10Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                uid: prometheus
                access: proxy
                url: http://prometheus-server.observability.svc.cluster.local
                isDefault: true
                jsonData:
                  httpMethod: POST
              - name: Loki
                type: loki
                uid: loki
                access: proxy
                url: http://loki-gateway.observability.svc.cluster.local
              - name: Tempo
                type: tempo
                uid: tempo
                access: proxy
                url: http://tempo.observability.svc.cluster.local:3200
              - name: Pyroscope
                type: grafana-pyroscope-datasource
                uid: pyroscope
                access: proxy
                url: http://pyroscope.observability.svc.cluster.local:4040
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: kubernetes
                orgId: 1
                folder: Kubernetes
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/kubernetes
              - name: istio
                orgId: 1
                folder: Istio
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/istio
        dashboards:
          kubernetes:
            k8s-views-global:
              gnetId: 15757
              revision: 43
              datasource: Prometheus
            k8s-views-namespaces:
              gnetId: 15758
              revision: 46
              datasource: Prometheus
            k8s-views-nodes:
              gnetId: 15759
              revision: 40
              datasource: Prometheus
            k8s-views-pods:
              gnetId: 15760
              revision: 39
              datasource: Prometheus
            k8s-system-api-server:
              gnetId: 15761
              revision: 21
              datasource: Prometheus
            k8s-system-coredns:
              gnetId: 15762
              revision: 22
              datasource: Prometheus
          istio:
            istio-mesh:
              gnetId: 7639
              revision: 301
              datasource: Prometheus
            istio-performance:
              gnetId: 11829
              revision: 300
              datasource: Prometheus
            istio-service:
              gnetId: 7636
              revision: 300
              datasource: Prometheus
            istio-workload:
              gnetId: 7630
              revision: 301
              datasource: Prometheus
            istio-control-plane:
              gnetId: 7645
              revision: 300
              datasource: Prometheus
            istio-wasm-extension:
              gnetId: 13277
              revision: 258
              datasource: Prometheus
        plugins:
          - grafana-pyroscope-app
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
